# cargo audit: что известно и почему пока так. Пересматривать при каждом обновлении зависимостей.
[advisories]
ignore = [
    # rsa (Marvin): утечка по времени при РАСШИФРОВКЕ RSA. У нас rsa приходит через russh
    # («Свой сервер», вход по SSH) — там RSA только подписывает и проверяет подпись, не
    # расшифровывает. Исправленной версии rsa ещё нет; без фичи rsa не войти на VPS с
    # ключом id_rsa.
    "RUSTSEC-2023-0071",
]
# НЕ в списке и ждут обновления сверху:
#   RUSTSEC-2026-0459 libsqlite3-sys 0.38.2 — держит Arti (tor-dirmgr требует rusqlite < 0.41);
#   RUSTSEC-2026-0387 crypto-bigint 0.5.5 — приходит с rsa 0.9.
