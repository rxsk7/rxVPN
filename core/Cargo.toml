[package]
name = "rxvpn-core"
version = "0.16.3"
edition = "2021"
build = "build.rs"
description = "Ядро rxvpn: парсинг ссылок, конфиг Xray, запуск, системный прокси"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rxvpn-i18n-macros = { path = "../i18n-macros" }
url = "2"
percent-encoding = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "net", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# 0.40: tor-dirmgr (Arti) просит <0.41, а sqlite в сборке может быть только одна.
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
# «Telegram без VPN» (tgproxy): AES-CTR обфускации MTProto и TLS к веб-входу Telegram.
aes = "0.8"
ctr = "0.9"
getrandom = "0.2"
# SHA-1 для проверки ответа WebSocket (уже есть в сборке через rustls).
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
# «Свой сервер»: SSH + SFTP к VPS (бэкенд ring — без aws-lc, собирается под windows-gnu),
# x25519 для Reality, затирание паролей в памяти.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
curve25519-dalek = "5"
zeroize = { version = "1", features = ["serde"] }
# Tor на Arti (этап 6). Точная версия: в Arti между версиями ломается API TorClient.
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "onion-service-client"], optional = true }
tor-rtcompat = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls"], optional = true }
tor-chanmgr = { version = "=0.47.0", default-features = false, optional = true }

[features]
default = []
tor = ["dep:arti-client", "dep:tor-rtcompat", "dep:tor-chanmgr"]

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Трафик по программам: события сети Windows (ETW, Microsoft-Windows-Kernel-Network).
ferrisetw = "1.2"
# Открыть ссылку от имени Проводника пользователя (без прав администратора): COM-интерфейсы оболочки.
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Ole", "Win32_Foundation"] }
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security_Cryptography", "Win32_NetworkManagement_WiFi", "Win32_Globalization", "Win32_System_Com", "Win32_Security_Authorization", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_Rpc"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
